<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Integer Calculator :) </title>
</head>
<body>
  <h1>Calculate an Operation Between Two Int Numbers =) </h1>
  <input type="number" id="num1" placeholder="First number" />
  <select name="operation" id="operation">
    <option value="+">+</option>
    <option value="-">-</option>
    <option value="*">*</option>
    <option value="/">÷</option>
  </select>
  <input type="number" id="num2" placeholder="Second number" />
  <button type="button" id="btnCalculate">Calculate</button>
  <p>Result: <strong id="result"></strong></p>

  <!-- Link to the compiled JS (compile sum.ts with: tsc sum.ts) -->
  <script src="sum.js"></script>
  <script src="substract.js"></script>
  <script src="multiply.js"></script>
  <script src="divide.js"></script>
  <script>
    const operation = document.getElementById('operation').value

    document.getElementById('btnCalculate').addEventListener('click', function () {
      var a = Number(document.getElementById('num1').value) || 0;
      var b = Number(document.getElementById('num2').value) || 0;

      if (operation === '+'){
        document.getElementById('result').textContent = sum(a, b);
      }
      else if (operation === '-'){
        document.getElementById('result').textContent = substract(a, b);
      }
      else if (operation === '*'){
        document.getElementById('result').textContent = multiply(a, b);
      }
      else if (operation === '/'){
        document.getElementById('result').textContent = divide(a, b);
      };
    });
  </script>
</body>
</html>
